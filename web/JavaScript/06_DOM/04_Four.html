<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chai aur Code</title>
</head>
<body style="background-color: #212121;color:#fff;">
    <ul class="language">
        <li>JavaScript</li>
    </ul>
    
</body>
<script>
    function addLanguage(langName){
        const li = document.createElement('li')
        li.innerHTML = `${langName}`
        document.querySelector('.language').appendChild(li)
    }
    addLanguage("python")
    addLanguage("typeScript")

    function addOptiLanguage(langName){
        const li = document.createElement('li')
        li.appendChild(document.createTextNode(langName))
        document.querySelector('.language').appendChild(li)
    }
    addOptiLanguage("java");
    addOptiLanguage("go-lang");
    addOptiLanguage("swift");

    // Edit Values
    const secLang = document.querySelector("li:nth-child(2)")
    // secLang.innerHTML = "Ruby"
    const newli = document.createElement('li')
    newli.textContent = "Ruby"
    secLang.replaceWith(newli);

    //edit
    const FirLang = document.querySelector("li:nth-child(1)")
    FirLang.outerHTML = '<li>TypeScript</li>'


    //remove
    const lastLang = document.querySelector('li:last-child')
    lastLang.remove();

</script>
</html>
